<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilas · a quiet coin laundry</title>
  <meta name="description" content="A quiet 3D coin laundry with synthesized ASMR. Feed the changer, wash, tumble dry, hang and fold, one shirt at a time.">
  <meta name="theme-color" content="#151d20">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bilas">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-label="3D coin laundry"></canvas>
  <div class="lens" aria-hidden="true"></div>
  <div class="callout" id="callout" aria-hidden="true"></div>

  <header class="brand" aria-label="Bilas">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M11 22c3-3 6 3 9 0s6 3 9 0" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-name">bilas</div>
      <div class="brand-sub" data-i18n="sign_sub1">coin laundry</div>
    </div>
  </header>

  <div class="top-right">
    <div class="purse" id="purse" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="var(--brass)"/><circle cx="12" cy="12" r="6" fill="none" stroke="#7a5a1c" stroke-width="1.5"/></svg>
      <span id="purseText">0 coins</span>
    </div>
    <button class="icon-btn" id="btnSound" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="soundWaves" d="M16 8.5c1.4 1 1.4 6 0 7M18.5 6c2.8 2.2 2.8 9.8 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2.2" fill="var(--card)" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="2.2" fill="var(--card)" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.2" fill="var(--card)" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </div>

  <section class="settings ticket" id="settings" hidden aria-label="Settings">
    <h2 data-i18n="settings">Settings</h2>
    <label class="row"><span data-i18n="volume">Volume</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <div class="row"><span data-i18n="theme">Time of day</span>
      <div class="seg" role="group"><button type="button" data-theme-set="night" data-i18n="theme_night">Night, rain</button><button type="button" data-theme-set="day" data-i18n="theme_day">Morning</button></div>
    </div>
    <div class="row"><span data-i18n="cycle">Cycle length</span>
      <div class="seg" role="group"><button type="button" data-cycle="45" data-i18n="cycle_short">45 s</button><button type="button" data-cycle="180" data-i18n="cycle_long">3 min</button></div>
    </div>
    <div class="row"><span data-i18n="grain">Film grain</span>
      <div class="seg" role="group"><button type="button" data-grain="on" data-i18n="grain_on">On</button><button type="button" data-grain="off" data-i18n="grain_off">Off</button></div>
    </div>
    <div class="row"><span data-i18n="language">Language</span>
      <div class="seg" role="group"><button type="button" data-lang="en">English</button><button type="button" data-lang="id">Indonesia</button></div>
    </div>
  </section>

  <aside class="side">
    <div class="load ticket" id="load" aria-label="This load">
      <div class="load-title" data-i18n="load">This load</div>
      <ol class="load-list" id="loadList"></ol>
      <p class="load-sum" id="loadSum"></p>
    </div>
    <div class="tickets" id="tickets" aria-live="off"></div>
  </aside>

  <div class="bottom">
    <p class="hint ticket" id="hint" aria-live="polite"></p>
      <div class="drag-cue" id="dragCue" aria-hidden="true"><i></i></div>
    <nav class="stations" id="stations" aria-label="Places in the laundry">
      <button type="button" data-st="change"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="15" r="2.6" fill="currentColor"/></svg><span data-i18n="st_change">Change</span></button>
      <button type="button" data-st="wash"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 13.6c1-.8 1.6.8 2.4 0s1.6.8 2.4 0" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span data-i18n="st_wash">Wash</span></button>
      <button type="button" data-st="dry"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 11.5l4 3M14 11.5l-4 3" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="st_dry">Dry</span></button>
      <button type="button" data-st="hang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5c6 2 14 2 20 0" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 6l-3 3 2 2 1-1v8h8v-8l1 1 2-2-3-3c-1 1.4-2.2 2-3 2s-2-.6-3-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span data-i18n="st_hang">Hang</span></button>
      <button type="button" data-st="fold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14v4H5zM5 13h14v4H5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9l2-3h10l2 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="st_fold">Fold</span></button>
      <button type="button" data-st="sit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h18M5 13v6M19 13v6M4 9h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="st_sit">Sit</span></button>
    </nav>
  </div>

  <button class="stand ticket" id="btnStand" type="button" hidden data-i18n="stand">Stand up</button>

  <p class="beat" id="beat" hidden aria-live="polite"></p>

  <div class="overlay" id="intro">
    <div class="card ticket">
      <svg class="intro-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11 22c3-3 6 3 9 0s6 3 9 0" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <h1>bilas</h1>
      <p class="tagline" data-i18n="tagline">A quiet coin laundry.</p>
      <button class="primary" id="btnStart" type="button" data-i18n="start">Step inside</button>
      <p class="small" data-i18n="headphones">Best with headphones.</p>
      <div class="seg intro-lang" role="group" aria-label="Language"><button type="button" data-lang="en">English</button><button type="button" data-lang="id">Indonesia</button></div>
    </div>
  </div>

  <div class="overlay" id="done" hidden>
    <div class="card ticket receipt">
      <div class="receipt-head">
        <span class="receipt-brand">bilas</span>
        <span class="receipt-stamp" id="doneStamp"></span>
      </div>
      <h2 data-i18n="done_title">Clean, dry, folded.</h2>
      <ol class="receipt-lines" id="doneLines"></ol>
      <p id="doneBody"></p>
      <p class="receipt-thanks" data-i18n="rc_thanks">Thank you. Come back soon.</p>
      <div class="done-actions">
        <button class="primary" id="btnAgain" type="button" data-i18n="done_again">Another load</button>
        <button class="secondary" id="btnStay" type="button" data-i18n="done_stay">Stay a while</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="nogl" hidden>
    <div class="card ticket">
      <h2 data-i18n="nogl_title">This browser can't draw the 3D room.</h2>
      <p data-i18n="nogl_body">Bilas needs WebGL.</p>
    </div>
  </div>

  <script src="js/three.global.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/shirts.js"></script>
  <script src="js/app.js"></script>
  <script>
    // offline + installable when served over http(s); file:// and the Android app (already local) skip it
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
